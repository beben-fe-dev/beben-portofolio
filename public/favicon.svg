<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141722"/>
      <stop offset="100%" stop-color="#08090d"/>
    </linearGradient>
  </defs>
  <!-- Apple Squircle Background -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <rect width="62" height="62" x="1" y="1" rx="15" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.2"/>
  
  <!-- BH Monogram -->
  <text x="31" y="43" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', sans-serif" font-size="28" font-weight="900" fill="url(#appleGrad)" text-anchor="middle" letter-spacing="-1.5">BH</text>
  
  <!-- Glowing Developer Terminal Dot -->
  <circle cx="50" cy="16" r="3.5" fill="#38bdf8"/>
</svg>
